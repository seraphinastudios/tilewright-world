version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    groups:
      # modernc.org/sqlite requires the exact modernc.org/libc it pins, so
      # the modernc modules move together.
      modernc:
        patterns:
          - "modernc.org/*"
  # The release planner's locked tools.
  - package-ecosystem: npm
    directory: /scripts/release
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
