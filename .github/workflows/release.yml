name: Release

# Releases tilewright-world: the tilewright CLI for five platforms, a source
# archive and the npm tarball of the browser pack reader
# (packages/tilewright-pack), all with SHA-256 digests and build provenance, plus
# the Go module tag go/vX.Y.Z. docs/RELEASING.md describes the whole process.
#
# - push to main: releases when commits since the last release call for
#   one. The first release is never cut by a push.
# - workflow_dispatch: the same, and the only way to cut the first release.
#   Maintenance branches (MAJOR.MINOR.x) are not protected like main, so
#   they only plan; MAINTENANCE_RELEASES in scripts/release/release-policy.cjs
#   says how to turn their releases on.
# - pull_request: builds and packages everything as a check; never attests
#   or publishes.
#
# npm publication is off until the repository variable TILEWRIGHT_NPM_PUBLISH
# is "true"; docs/RELEASING.md says how to turn it on.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/validate.yml
      - scripts/release/**
      - tools/release/**
      - tools/crates/**
      - tools/build-wasm.sh
      - packages/tilewright-pack/**
      - rust-toolchain.toml
      - Cargo.lock
      - '**/Cargo.toml'

permissions: {}

# Releases of one branch run one at a time, so their release jobs never
# overlap. GitHub keeps one pending run per group and cancels an older
# pending run for a newer one. For merges that is safe: the newer run's
# commit contains the older one's. A merge's run can neither cut the first
# release nor finish an unpublished one, so a waiting dispatch or re-run
# that it displaces has to be started again, and a re-run of an older run
# displaces a waiting merge's run (docs/RELEASING.md says what to do). Each
# branch has its own group, so a maintenance release never displaces one of
# main.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('world-release-check-{0}', github.event.pull_request.number) || format('world-release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_PACKAGE_DIRECTORY: packages/tilewright-pack

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Only repository code runs here: the planner (scripts/release) has no
    # dependencies. The jobs that use these outputs check them again.
    outputs:
      version: ${{ steps.plan.outputs.version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Check out with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Test the release policy, planner and packaging
        run: |
          set -euo pipefail
          node scripts/release/test-release-policy.cjs
          node scripts/release/test-commits.cjs
          node scripts/release/test-plan.mjs
          python3 -m unittest discover -s tools/release

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The branch from the full ref: a dispatch may name a tag, and a
          # tag called "main" must not pass for the branch. A pull request
          # into another pull request's branch is checked as one into main.
          if [[ ${EVENT} == pull_request ]]; then
            if [[ ${BASE_REF} == main || ${BASE_REF} =~ ^[0-9]+\.[0-9]+\.x$ ]]; then
              BRANCH=${BASE_REF}
            else
              BRANCH=main
            fi
          elif [[ ${GITHUB_REF} == refs/heads/* ]]; then
            BRANCH=${GITHUB_REF#refs/heads/}
          else
            echo "::error::releases run from a branch, not ${GITHUB_REF}"
            exit 1
          fi
          plan="${RUNNER_TEMP}/plan.json"
          TILEWRIGHT_RELEASE_TRIGGER=${EVENT} TILEWRIGHT_RELEASE_BRANCH=${BRANCH} \
            node scripts/release/plan.mjs >"${plan}"
          # One JSON object, for the run's own commit and branch.
          if ! jq -se 'length == 1 and (.[0] | type) == "object"' "${plan}" >/dev/null; then
            echo "::error::the planner did not print one JSON object"
            exit 1
          fi
          if [[ $(jq -r .revision "${plan}") != "${GITHUB_SHA}" || $(jq -r .branch "${plan}") != "${BRANCH}" ]]; then
            echo "::error::the plan is for $(jq -c '[.revision, .branch]' "${plan}"), not ${GITHUB_SHA} on ${BRANCH}"
            exit 1
          fi
          {
            echo '### Release plan'
            echo
            echo '```json'
            jq . "${plan}"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          echo "::notice title=Release plan::$(jq -r '.reason | tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' "${plan}")"
          release_version='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          previous_tag=$(jq -r '.previous_tag // empty' "${plan}")
          if [[ -n ${previous_tag} && ! ${previous_tag} =~ ^v${release_version}$ ]]; then
            echo "::error::invalid previous release tag: $(jq -c .previous_tag "${plan}")"
            exit 1
          fi
          if [[ ${EVENT} == pull_request ]]; then
            # A check build under a version that can never be released. A
            # pull request never publishes; the publishing jobs also check
            # the event themselves.
            publish=false
            build=true
            version="0.0.0-check.${PULL_REQUEST}"
          elif [[ $(jq -r .publish "${plan}") == true ]]; then
            publish=true
            build=true
            version=$(jq -r .version "${plan}")
            if [[ ! ${version} =~ ^${release_version}$ ]]; then
              echo "::error::invalid release version: $(jq -c .version "${plan}")"
              exit 1
            fi
          else
            publish=false
            build=false
            version=
          fi
          {
            echo "version=${version}"
            echo "previous_tag=${previous_tag}"
            echo "build=${build}"
            echo "publish=${publish}"
          } >>"${GITHUB_OUTPUT}"

      # A release tag is created before its release is published. If a run
      # failed in between, finish that release before any newer one, which
      # would otherwise count from a tag that has no release. A release that
      # came out mutable stops newer ones too, until the owner has repaired
      # it. Every later job needs this job to succeed.
      - name: Stop at an unfinished release
        # Pull requests never tag or publish, and one may be the fix that
        # an unfinished release needs.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.plan.outputs.previous_tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z ${PREVIOUS_TAG} ]]; then
            exit 0
          fi
          # A failed request prints its error body, which is not "true", and
          # its status on stderr, which stays in the log.
          finished=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PREVIOUS_TAG}" --jq '.draft == false and .immutable == true' || true)
          if [[ ${finished} != true ]]; then
            echo "::error::${PREVIOUS_TAG}, the latest release tag on ${BRANCH}, has no published immutable release. Finish or repair that release first; see \"When a release fails\" in docs/RELEASING.md."
            exit 1
          fi

  validate:
    name: Revalidate
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Each target builds on a GitHub-hosted runner of its own OS and
        # architecture. Keep in step with PLATFORMS in tools/release/package.py.
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      # The fixture compiles to the same pack on every platform only from the
      # committed bytes.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false

      - name: Check out the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install musl-gcc
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes musl-tools

      - name: Build and run the CLI
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash tools/release/build.sh "${TARGET}" "${VERSION}" dist/cli

      - name: Keep the binary for packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/cli/
          if-no-files-found: error
          retention-days: 30
          # A re-run of this job replaces its artifact.
          overwrite: true

  npm:
    name: Build the npm package
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.NPM_PACKAGE_DIRECTORY }}/.node-version
          package-manager-cache: false

      - name: Build the WebAssembly module
        run: tools/build-wasm.sh

      - name: Pack at the release version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          test -s "${NPM_PACKAGE_DIRECTORY}/wasm/tilewright_pack_bg.wasm"
          mkdir -p dist/npm
          destination=$(realpath dist/npm)
          cd "${NPM_PACKAGE_DIRECTORY}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version --ignore-scripts
          npm pack --ignore-scripts --pack-destination "${destination}"

      - name: Keep the tarball for packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: dist/npm/
          if-no-files-found: error
          retention-days: 30
          # A re-run of this job replaces its artifact.
          overwrite: true

  crates:
    name: Prepare crate candidates
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # No restored cache or registry credentials; package/build stay offline
      # after fetching only the committed dependency graph.
      CARGO_HOME: ${{ runner.temp }}/candidate-cargo
    steps:
      - name: Check out the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache locked dependencies without credentials
        run: |
          set -euo pipefail
          python3 -c 'import sys; sys.path.insert(0, "tools/crates"); import prepare; prepare.environment()'
          cargo fetch --locked

      - name: Prepare twice and build the exact packaged graph
        run: |
          set -euo pipefail
          python3 tools/crates/prepare.py prepare "${RUNNER_TEMP}/crate-candidates"
          python3 tools/crates/prepare.py verify "${RUNNER_TEMP}/crate-candidates" --build

      - name: Keep the verified candidates for packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-candidates
          path: ${{ runner.temp }}/crate-candidates/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  package:
    name: Package release assets
    needs: [plan, build, npm, crates]
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' && needs.build.result == 'success' && needs.npm.result == 'success' && needs.crates.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist/binaries
          merge-multiple: true

      - name: Collect the npm tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist/npm

      - name: Collect the crate candidates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate-candidates
          path: dist/crate-candidates

      - name: Assemble the assets and SHA256SUMS
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          tarballs=(dist/npm/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 || ! -f ${tarballs[0]} ]]; then
            echo "expected exactly one npm tarball" >&2
            exit 1
          fi
          python3 tools/release/package.py assemble --version "${VERSION}" \
            --revision "${REVISION}" --binaries dist/binaries --output dist/release \
            --npm-tarball "${tarballs[0]}" --crate-candidates dist/crate-candidates
          {
            echo "### Release assets for ${VERSION}"
            echo
            echo '```'
            cat dist/release/assets/SHA256SUMS
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Keep the assets for attestation and publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
          # A re-run of this job replaces its artifact.
          overwrite: true

  attest:
    name: Attest build provenance
    needs: [plan, validate, package]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.plan.outputs.publish == 'true' && github.ref_type == 'branch' && needs.validate.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/release

      - name: Verify the assets before attesting them
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python3 tools/release/package.py verify --version "${VERSION}" --revision "${GITHUB_SHA}" --npm dist/release

      # One attestation covers every asset, SHA256SUMS included, and the bare
      # binaries the archives hold, so an installed binary verifies too.
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/assets/*
            dist/release/binaries/*

  release:
    name: Publish the GitHub release
    needs: [plan, attest]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.plan.outputs.publish == 'true' && github.ref_type == 'branch' && needs.attest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      # The tags follow from the version, the branch is the run's own, and
      # tags.sh checks the version and the previous tag before any tag.
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ format('v{0}', needs.plan.outputs.version) }}
      GO_TAG: ${{ format('go/v{0}', needs.plan.outputs.version) }}
      REVISION: ${{ github.sha }}
      BRANCH: ${{ github.ref_name }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
      LATEST: ${{ github.ref_name == 'main' }}
    steps:
      - name: Check out the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/release

      - name: Verify the assets
        run: python3 tools/release/package.py verify --version "${VERSION}" --revision "${GITHUB_SHA}" --npm dist/release

      # Both tags first, at the revision, in one atomic push; tags.sh says
      # why, and how a re-run picks up what a failed attempt left.
      - name: Create the release and Go tags
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release/tags.sh

      - name: Write the release notes
        if: steps.tag.outputs.published != 'true'
        run: bash tools/release/notes.sh dist/release/assets >"${RUNNER_TEMP}/notes.md"

      # gh creates a draft, uploads every asset, then publishes it. With
      # immutable releases on, publishing locks the tag and the assets.
      - name: Publish
        if: steps.tag.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          options=(--verify-tag --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
            --generate-notes "--latest=${LATEST}")
          if [[ -n ${PREVIOUS_TAG} ]]; then
            options+=(--notes-start-tag "${PREVIOUS_TAG}")
          fi
          gh release create "${TAG}" dist/release/assets/* "${options[@]}"

      - name: Check the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/releases/tags/${TAG}" >"${RUNNER_TEMP}/release.json"
          if ! jq -e '.draft == false and .immutable == true' "${RUNNER_TEMP}/release.json" >/dev/null; then
            echo "::error::${TAG} was published, but it is not immutable. Turn immutable releases back on and see docs/RELEASING.md."
            exit 1
          fi
          for tag in "${TAG}" "${GO_TAG}"; do
            tagged=$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq .object.sha)
            if [[ ${tagged} != "${REVISION}" ]]; then
              echo "::error::${tag} points at ${tagged}, not ${REVISION}"
              exit 1
            fi
          done
          cd dist/release/assets
          diff -u \
            <({ cat SHA256SUMS; sha256sum SHA256SUMS; } | sort -k2) \
            <(jq -r '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' "${RUNNER_TEMP}/release.json" | sort -k2)
          {
            jq -r .html_url "${RUNNER_TEMP}/release.json"
            echo
            echo "${GO_TAG} -> ${REVISION}"
          } >>"${GITHUB_STEP_SUMMARY}"

      # The Go module proxy and checksum database learn of a version the
      # first time someone asks for it. Asking right away has sum.golang.org
      # record the module's checksum at release time, so that version's
      # content can never change for any Go user. The release is already
      # published, so a slow proxy or checksum database only warns. The
      # step fails, but not the job, if the proxy serves the version from
      # a commit whose module files differ from the release's.
      - name: Record the Go module version in the checksum database
        # At most 220 s for the proxy, 140 s for git and 280 s for the
        # checksum database: under 11 minutes.
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set -euo pipefail
          module=$(awk '$1 == "module" { print $2; exit }' go/go.mod)
          # Proxy paths escape capital letters; this module path has none.
          if [[ ! ${module} =~ ^[a-z0-9./_-]+$ ]]; then
            echo "::warning::cannot ask the Go proxy for the module path '${module}'"
            exit 0
          fi
          by_hand="GOPROXY=https://proxy.golang.org go mod download -json ${module}@${TAG}"
          # Six tries, each limited to $3 seconds, 20 seconds apart.
          fetch() {
            local attempt
            for ((attempt = 1; attempt <= 6; attempt++)); do
              if curl -fsS --max-time "$3" -o "$2" "$1"; then
                return 0
              fi
              if ((attempt < 6)); then
                sleep 20
              fi
            done
            return 1
          }

          info="${RUNNER_TEMP}/go-module.info"
          if ! fetch "https://proxy.golang.org/${module}/@v/${TAG}.info" "${info}" 20; then
            echo "::warning::proxy.golang.org did not serve ${module}@${TAG}. The release is published; to record the version, run: ${by_hand}"
            exit 0
          fi
          resolved=$(jq -r '.Origin.Hash // empty' "${info}")
          if [[ -z ${resolved} ]]; then
            echo "::warning::proxy.golang.org did not say which commit ${module}@${TAG} is"
          elif [[ ! ${resolved} =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::proxy.golang.org named an invalid commit for ${module}@${TAG}: $(jq -c .Origin.Hash "${info}")"
            exit 1
          elif [[ ${resolved} != "${REVISION}" ]]; then
            # After a start-over (docs/RELEASING.md), the proxy keeps the
            # commit it saw first. The module zip holds go/ and the root
            # LICENSE, so the content is the same if those are.
            fetched=false
            for ((attempt = 1; attempt <= 3; attempt++)); do
              if timeout 40 git fetch --quiet --depth=1 origin "${resolved}"; then
                fetched=true
                break
              fi
              if ((attempt < 3)); then
                sleep 10
              fi
            done
            compared=2
            if [[ ${fetched} == true ]]; then
              compared=0
              git diff --quiet "${resolved}" "${REVISION}" -- go LICENSE || compared=$?
            fi
            if ((compared == 0)); then
              echo "::notice::proxy.golang.org serves ${module}@${TAG} from ${resolved}, an earlier commit with the same go/ and LICENSE as ${REVISION}"
            elif ((compared == 1)); then
              echo "::error::proxy.golang.org serves ${module}@${TAG} from ${resolved}, not ${REVISION}, and their go/ or LICENSE differ"
              exit 1
            else
              echo "::warning::proxy.golang.org serves ${module}@${TAG} from ${resolved}, not ${REVISION}, and git could not compare the two; compare them by hand as docs/RELEASING.md says"
            fi
          fi

          record="${RUNNER_TEMP}/go-module.sum"
          if ! fetch "https://sum.golang.org/lookup/${module}@${TAG}" "${record}" 30; then
            echo "::warning::sum.golang.org did not record ${module}@${TAG}. The release is published; to record the version, run: ${by_hand}"
            exit 0
          fi
          {
            echo
            echo "sum.golang.org records ${module}@${TAG}:"
            echo
            echo '```'
            grep -F "${module} ${TAG}" "${record}" || true
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          echo "::notice::sum.golang.org recorded ${module}@${TAG}"

  npm-publish:
    name: Publish to npm
    needs: [plan, release]
    # Off until the owner sets the repository variable TILEWRIGHT_NPM_PUBLISH
    # to true; see docs/RELEASING.md. Only releases from main are published,
    # and the npm environment admits only main. Publishing in the release's
    # own run gives npm's provenance the release's commit.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.plan.outputs.publish == 'true' && github.ref == 'refs/heads/main' && needs.release.result == 'success' && vars.TILEWRIGHT_NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      attestations: read
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ format('v{0}', needs.plan.outputs.version) }}
      VERSION: ${{ needs.plan.outputs.version }}
      REVISION: ${{ github.sha }}
      PACKAGE: '@seraphinastudios/tilewright-pack'
    steps:
      # The job checks out nothing: it publishes the tarball the immutable
      # release carries, byte for byte, once it matches SHA256SUMS, GitHub's
      # asset digest and the provenance this run attested.
      - name: Download and check the release's npm tarball
        id: tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/releases/tags/${TAG}" >"${RUNNER_TEMP}/release.json"
          if ! jq -e '.draft == false and .prerelease == false and .immutable == true' "${RUNNER_TEMP}/release.json" >/dev/null; then
            echo "::error::${TAG} is not a published, immutable release"
            exit 1
          fi
          mkdir dist
          gh release download "${TAG}" --dir dist --pattern SHA256SUMS --pattern '*.tgz'
          cd dist
          tarballs=(*.tgz)
          if [[ ${#tarballs[@]} -ne 1 || ! -f ${tarballs[0]} ]]; then
            echo "::error::${TAG} does not carry exactly one npm tarball"
            exit 1
          fi
          tarball=${tarballs[0]}
          listed=$(awk -v name="${tarball}" '$2 == name' SHA256SUMS)
          if [[ $(wc -l <<<"${listed}") -ne 1 || -z ${listed} ]]; then
            echo "::error::SHA256SUMS does not list ${tarball} once"
            exit 1
          fi
          sha256sum --check --strict <<<"${listed}"
          recorded=$(jq -r --arg name "${tarball}" '.assets[] | select(.name == $name) | .digest' "${RUNNER_TEMP}/release.json")
          if [[ ${recorded} != "sha256:$(sha256sum "${tarball}" | cut -d' ' -f1)" ]]; then
            echo "::error::${tarball} does not match the digest of the release asset"
            exit 1
          fi
          # Provenance from release.yml on main at the release commit only:
          # anyone who can push a branch can run a modified release.yml
          # there, so the signer's ref is pinned along with its path.
          gh attestation verify "${tarball}" --repo "${GH_REPO}" \
            --cert-identity "https://github.com/${GH_REPO}/.github/workflows/release.yml@refs/heads/main" \
            --source-ref refs/heads/main --source-digest "${REVISION}" --deny-self-hosted-runners
          manifest=$(tar -xOzf "${tarball}" package/package.json)
          if [[ $(jq -r .name <<<"${manifest}") != "${PACKAGE}" || $(jq -r .version <<<"${manifest}") != "${VERSION}" ]]; then
            echo "::error::${tarball} is not ${PACKAGE}@${VERSION}"
            exit 1
          fi
          # The newest release is npm's latest. A re-run after a newer
          # release gives this one a dist-tag for its line instead (a
          # dist-tag must not parse as a semver range, so "0.4" would not do).
          latest_tag=$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)
          if [[ ${latest_tag} == "${TAG}" ]]; then
            dist_tag=latest
          else
            dist_tag="release-$(cut -d. -f1-2 <<<"${VERSION}")"
          fi
          {
            echo "path=dist/${tarball}"
            echo "dist_tag=${dist_tag}"
          } >>"${GITHUB_OUTPUT}"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing exchanges this job's OIDC token for a short-lived
      # npm credential and adds npm's provenance statement; it needs npm
      # 11.5.1 or later.
      - name: Publish the attested tarball
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
          DIST_TAG: ${{ steps.tarball.outputs.dist_tag }}
        run: |
          set -euo pipefail
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error("npm " + process.argv[1] + " is too old for trusted publishing");
              process.exit(1);
            }' "$(npm --version)"
          # A version npm already has cannot be published again. If an
          # earlier attempt published this tarball and then failed, the
          # re-run checks the registry's copy and stops there.
          metadata="${RUNNER_TEMP}/registry.json"
          status=$(curl -sS --retry 3 -o "${metadata}" -w '%{http_code}' \
            -H 'Accept: application/vnd.npm.install-v1+json' \
            "https://registry.npmjs.org/${PACKAGE/\//%2f}")
          case ${status} in
            200) published=$(jq -r --arg version "${VERSION}" '.versions[$version].dist.integrity // empty' "${metadata}") ;;
            404) published= ;;
            *)
              echo "::error::the npm registry answered ${status} for ${PACKAGE}"
              exit 1
              ;;
          esac
          if [[ -z ${published} ]]; then
            npm publish "${TARBALL}" --access public --tag "${DIST_TAG}"
            exit 0
          fi
          if [[ ${published} != "sha512-$(openssl dgst -sha512 -binary "${TARBALL}" | base64 -w0)" ]]; then
            echo "::error::npm has a different tarball for ${PACKAGE}@${VERSION}"
            exit 1
          fi
          echo "::notice::npm already has this tarball as ${PACKAGE}@${VERSION}"
          # Trusted publishing can only publish, so a dist-tag that an
          # earlier attempt did not set is left to the owner.
          if [[ $(jq -r --arg tag "${DIST_TAG}" '."dist-tags"[$tag] // empty' "${metadata}") != "${VERSION}" ]]; then
            echo "::warning::the npm dist-tag ${DIST_TAG} does not point at ${VERSION}; to set it, run: npm dist-tag add ${PACKAGE}@${VERSION} ${DIST_TAG}"
          fi
