name: World validation

on:
  pull_request:
  push:
    branches:
      - main
  # The release workflow revalidates the revision it releases.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A called workflow sees its caller's github.workflow, so a release's
  # validation does not cancel, or get cancelled by, the push's own run.
  group: world-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: World validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain go/go.mod names, for the Go pack reader. No cache, so
      # nothing a run writes is restored into another.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Validate
        run: tools/validate.sh
