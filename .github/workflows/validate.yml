name: World validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: world-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: World validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain go/go.mod names, for the Go pack reader. No cache, so
      # nothing a run writes is restored into another.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      # The Node.js packages/tilewright-pack/.node-version names, for the
      # WebAssembly pack reader's tests. The reader's build tools are pinned
      # and checksum-verified by tools/build-wasm.sh. No cache.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: packages/tilewright-pack/.node-version
          package-manager-cache: false

      - name: Validate
        run: tools/validate.sh
