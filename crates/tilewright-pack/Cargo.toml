[package]
name = "tilewright-pack"
description = "Deterministic SQLite content packs for Tilewright worlds: compiler, chunk codec and verified reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rusqlite.workspace = true
sha2.workspace = true
tempfile.workspace = true
tilewright-jsonc.workspace = true
tilewright-source.workspace = true
zstd.workspace = true

# On the web (`wasm32-unknown-unknown`), SQLite comes from `sqlite-wasm-rs`,
# which compiles the same amalgamation for WebAssembly.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
rusqlite = { workspace = true, features = ["ffi-sqlite-wasm-rs"] }

[dev-dependencies]
rusqlite.workspace = true

[lints]
workspace = true
